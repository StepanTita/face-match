[project]
name = "facematch-core"
version = "0.1.0"
description = "Face-matching engine: detection, embedding, matching, checkpointing, archive walking."
requires-python = ">=3.11"
dependencies = [
    "insightface>=2.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facematch_core"]
