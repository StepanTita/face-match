[project]
name = "facematch-cli"
version = "0.1.0"
description = "facematch command-line tool: find a person, and group people, across a photo/video archive."
requires-python = ">=3.11"
dependencies = [
    "facematch-core",
    "imagehash>=4.3.2",
    "tqdm>=4.70.1",
]

[project.scripts]
facematch = "facematch_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facematch_cli"]

[tool.uv.sources]
facematch-core = { workspace = true }
